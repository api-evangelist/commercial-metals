description: >-
  Commercial Metals Company (CMC) is a Fortune 500 manufacturer, recycler, fabricator and marketer of
  steel and metal products — rebar, merchant and structural bar, wire rod, performance steel,
  construction products and ground improvement solutions — running recycling centers, mini-mills,
  micro-mills and fabrication plants across the United States, Europe and Asia for the construction,
  infrastructure, energy and manufacturing markets. CMC was an early mover on customer self-service
  with myCMC, a portal for inventory, pricing, online ordering, material release, document search and
  real-time order and delivery status, and it runs a business-to-business Systems Integration program
  whose own one-pager names EDI, API, CSV, XML and flat file across the Quote-To-Cash process. None of
  it is self-service: no developer portal, no API reference and no machine-readable contract is
  published on any CMC host as of September 2026 — integration is arranged through a CMC sales rep or
  ecommerce@cmc.com.
