description: >-
  Commercial Metals Company (CMC) is a Fortune 500 manufacturer, recycler,
  and marketer of steel and metal products serving the construction, energy,
  and manufacturing industries. CMC was the first US steel company to launch
  an online customer portal (myCMC), but does not currently publish a public
  developer API portal or OpenAPI specifications. Programmatic integrations
  with myCMC (order management, shipping, invoicing) are typically
  established through direct contracts with CMC's IT organization rather
  than via a self-service developer program.
